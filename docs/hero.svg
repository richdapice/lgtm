<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>lgtm: a pull request gets reviewed, fixed, and stamped</title>
  <style>
    :root { --card:#0d1117; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --add:#3fb950; --del:#f85149; --amber:#d29922; --ink:#58a6ff; }
    .t { fill: var(--text); } .m { fill: var(--muted); } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* 10 s loop. Everything keys off the same clock. */
    @keyframes eyes   { 0%,8% {opacity:0; transform:translateY(6px)} 12%,100% {opacity:1; transform:translateY(0)} }
    @keyframes find1  { 0%,11% {fill:#30363d} 12%,31% {fill:var(--amber)} 32%,100% {fill:var(--add)} }
    @keyframes find2  { 0%,14% {fill:#30363d} 15%,49% {fill:var(--amber)} 50%,100% {fill:var(--add)} }
    @keyframes lens   { 0%,8% {opacity:0} 10%,17% {opacity:1} 19%,100% {opacity:0} }
    @keyframes sweep  { 0%,9% {transform:translateX(0)} 17%,100% {transform:translateX(380px)} }
    @keyframes stamp  { 0%,56% {opacity:0; transform:rotate(-14deg) scale(2.6)} 61% {opacity:1; transform:rotate(-14deg) scale(.92)} 64% {transform:rotate(-14deg) scale(1.06)} 67%,100% {opacity:1; transform:rotate(-14deg) scale(1)} }
    @keyframes shake  { 0%,60% {transform:translate(0,0)} 62% {transform:translate(0,3px)} 64% {transform:translate(0,-1px)} 66%,100% {transform:translate(0,0)} }
    @keyframes splat  { 0%,60% {opacity:0; transform:scale(.2)} 63% {opacity:.9; transform:scale(1)} 80%,100% {opacity:0; transform:scale(1.3)} }
    @keyframes g0 { 0%,4% {fill:#30363d} 4.5%,9% {fill:#58a6ff} 9.5%,100% {fill:#3fb950} }
    @keyframes g1 { 0%,9% {fill:#30363d} 9.5%,17% {fill:#58a6ff} 17.5%,100% {fill:#3fb950} }
    @keyframes g2 { 0%,17% {fill:#30363d} 17.5%,26% {fill:#58a6ff} 26.5%,38% {fill:#3fb950} 38.5%,45% {fill:#58a6ff} 45.5%,100% {fill:#3fb950} }
    @keyframes g3 { 0%,26% {fill:#30363d} 26.5%,32% {fill:#58a6ff} 32.5%,38% {fill:#3fb950} 38.5%,45% {fill:#30363d} 45.5%,50% {fill:#58a6ff} 50.5%,100% {fill:#3fb950} }
    @keyframes g4 { 0%,32% {fill:#30363d} 32.5%,38% {fill:#58a6ff} 38.5%,38% {fill:#3fb950} 38.5%,50% {fill:#30363d} 50.5%,56% {fill:#58a6ff} 56.5%,100% {fill:#3fb950} }
    @keyframes g5 { 0%,56% {fill:#30363d} 56.5%,66% {fill:#58a6ff} 66.5%,100% {fill:#3fb950} }
    @keyframes g6 { 0%,66% {fill:#30363d} 66.5%,90% {fill:#58a6ff} 90.5%,100% {fill:#3fb950} }
    @keyframes l0 { 0%,4% {fill:#8b949e} 4.5%,100% {fill:#e6edf3} }
    @keyframes l1 { 0%,9% {fill:#8b949e} 9.5%,100% {fill:#e6edf3} }
    @keyframes l2 { 0%,17% {fill:#8b949e} 17.5%,100% {fill:#e6edf3} }
    @keyframes l3 { 0%,26% {fill:#8b949e} 26.5%,100% {fill:#e6edf3} }
    @keyframes l4 { 0%,32% {fill:#8b949e} 32.5%,100% {fill:#e6edf3} }
    @keyframes l5 { 0%,56% {fill:#8b949e} 56.5%,100% {fill:#e6edf3} }
    @keyframes l6 { 0%,66% {fill:#8b949e} 66.5%,100% {fill:#e6edf3} }
    @keyframes loopArc { 0%,16% {opacity:0} 18%,55% {opacity:1} 57%,100% {opacity:0} }
    @keyframes loopRun { 0% {stroke-dashoffset:0} 100% {stroke-dashoffset:-240} }
    @keyframes round1  { 0%,16% {opacity:0} 18%,37% {opacity:1} 38%,100% {opacity:0} }
    @keyframes round2  { 0%,37% {opacity:0} 39%,55% {opacity:1} 57%,100% {opacity:0} }
    @keyframes thumb  { 0%,90% {opacity:0; transform:translateY(6px)} 93%,100% {opacity:1; transform:translateY(0)} }
    @keyframes fade   { 0%,96% {opacity:1} 100% {opacity:0} }

    .anim { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    #eyes   { animation-name: eyes; }
    #f1     { animation-name: find1; }
    #f2     { animation-name: find2; }
    #lens   { animation-name: lens; }
    #sweep  { animation-name: sweep; animation-timing-function: ease-in-out; }
    #stamp  { animation-name: stamp; transform-origin: 700px 170px; animation-timing-function: cubic-bezier(.2,.9,.3,1.2); }
    #card   { animation-name: shake; }
    .splat  { animation-name: splat; transform-origin: 700px 170px; }
    #g0 { animation-name: g0; animation-timing-function: steps(1) } #l0 { animation-name: l0; animation-timing-function: steps(1) } #g1 { animation-name: g1; animation-timing-function: steps(1) } #l1 { animation-name: l1; animation-timing-function: steps(1) } #g2 { animation-name: g2; animation-timing-function: steps(1) } #l2 { animation-name: l2; animation-timing-function: steps(1) } #g3 { animation-name: g3; animation-timing-function: steps(1) } #l3 { animation-name: l3; animation-timing-function: steps(1) } #g4 { animation-name: g4; animation-timing-function: steps(1) } #l4 { animation-name: l4; animation-timing-function: steps(1) } #g5 { animation-name: g5; animation-timing-function: steps(1) } #l5 { animation-name: l5; animation-timing-function: steps(1) } #g6 { animation-name: g6; animation-timing-function: steps(1) } #l6 { animation-name: l6; animation-timing-function: steps(1) }
    #arc    { animation-name: loopArc; }
    #arcRun { animation: loopRun 2.4s linear infinite; }
    #round1 { animation-name: round1; } #round2 { animation-name: round2; }
    #thumb  { animation-name: thumb; }
    #stage  { animation-name: fade; animation-timing-function: linear; }
  </style>

  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <clipPath id="cardclip"><rect x="40" y="30" width="600" height="280" rx="14"/></clipPath>
  </defs>

  <g id="stage" class="anim">
    <!-- the pull request -->
    <g id="card" class="anim">
      <rect x="40" y="30" width="600" height="280" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="64" y="66" font-size="18" font-weight="600" class="t">Throttle the settings poll to 5 minutes</text>
      <text x="64" y="90" font-size="13" class="m mono">worktree-sync-throttle → main</text>
      <text x="470" y="90" font-size="13" class="mono" fill="#3fb950">+142</text>
      <text x="516" y="90" font-size="13" class="mono" fill="#f85149">−18</text>

      <!-- diff lines: bars stand in for code -->
      <g clip-path="url(#cardclip)" class="mono" font-size="12">
        <rect x="64" y="112" width="560" height="112" rx="6" fill="#161b22"/>
        <text x="76" y="132" fill="#8b949e">@@ -136,6 +136,9 @@</text>
        <rect x="76" y="141" width="4" height="12" fill="#3fb950"/><rect x="88" y="143" width="180" height="8" rx="2" fill="#2ea043" opacity=".55"/>
        <rect x="76" y="159" width="4" height="12" fill="#3fb950"/><rect x="88" y="161" width="260" height="8" rx="2" fill="#2ea043" opacity=".55"/>
        <rect id="f1" class="anim" x="76" y="177" width="4" height="12"/><rect x="88" y="179" width="300" height="8" rx="2" fill="#8b949e" opacity=".35"/>
        <rect x="76" y="195" width="4" height="12" fill="#f85149"/><rect x="88" y="197" width="140" height="8" rx="2" fill="#f85149" opacity=".45"/>
        <rect id="f2" class="anim" x="76" y="213" width="4" height="12"/><rect x="88" y="215" width="220" height="8" rx="2" fill="#8b949e" opacity=".35"/>
        <!-- the review passing over the diff -->
        <g id="lens" class="anim"><g id="sweep" class="anim">
          <rect x="70" y="118" width="120" height="100" rx="6" fill="#58a6ff" opacity=".07"/>
          <rect x="70" y="118" width="2" height="100" fill="#58a6ff" opacity=".8"/>
        </g></g>
      </g>

      <!-- the gate track: what lgtm actually does, in order -->
    <g font-size="11.5" font-weight="500">
        <circle id="g0" class="anim" cx="72" cy="248" r="5"/><text id="l0" class="anim" x="83" y="252">check</text>
        <circle id="g1" class="anim" cx="150" cy="248" r="5"/><text id="l1" class="anim" x="161" y="252">review</text>
        <circle id="g2" class="anim" cx="228" cy="248" r="5"/><text id="l2" class="anim" x="239" y="252">fix</text>
        <circle id="g3" class="anim" cx="306" cy="248" r="5"/><text id="l3" class="anim" x="317" y="252">check</text>
        <circle id="g4" class="anim" cx="384" cy="248" r="5"/><text id="l4" class="anim" x="395" y="252">verify</text>
        <circle id="g5" class="anim" cx="462" cy="248" r="5"/><text id="l5" class="anim" x="473" y="252">pr</text>
        <circle id="g6" class="anim" cx="540" cy="248" r="5"/><text id="l6" class="anim" x="551" y="252">ci</text>
    </g>

    <!-- the loop: decide → fix → check → verify goes around until it's clean -->
    <g id="arc" class="anim">
      <path id="arcRun" d="M 384 258 C 384 274, 228 274, 228 258" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 5" opacity=".9"/>
      <path d="M 224 262 L 228 256 L 232 262" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
      <text id="round1" class="anim" x="306" y="279" text-anchor="middle" font-size="10.5" fill="#8b949e">round 1 of 3</text>
      <text id="round2" class="anim" x="306" y="279" text-anchor="middle" font-size="10.5" fill="#8b949e">round 2 of 3</text>
    </g>

    <!-- reactions -->
      <g id="eyes" class="anim">
        <rect x="64" y="270" width="52" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
        <text x="76" y="287" font-size="13">👀</text><text x="98" y="287" font-size="12" class="t">1</text>
      </g>
      <g id="thumb" class="anim">
        <rect x="124" y="270" width="52" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
        <text x="136" y="287" font-size="13">👍</text><text x="158" y="287" font-size="12" class="t">1</text>
      </g>
    </g>

    <!-- ink splatter -->
    <g fill="#58a6ff">
      <circle class="splat anim" cx="612" cy="112" r="4"/>
      <circle class="splat anim" cx="790" cy="138" r="3"/>
      <circle class="splat anim" cx="632" cy="226" r="5"/>
      <circle class="splat anim" cx="812" cy="208" r="4"/>
      <circle class="splat anim" cx="700" cy="86" r="3"/>
      <circle class="splat anim" cx="704" cy="258" r="4"/>
    </g>

    <!-- the stamp -->
    <g id="stamp" class="anim" filter="url(#rough)">
      <rect x="586" y="122" width="228" height="96" rx="10" fill="none" stroke="#58a6ff" stroke-width="6"/>
      <rect x="596" y="132" width="208" height="76" rx="6" fill="none" stroke="#58a6ff" stroke-width="2" opacity=".7"/>
      <text x="700" y="192" text-anchor="middle" font-size="60" font-weight="800" fill="#58a6ff" letter-spacing="4">LGTM</text>
    </g>
  </g>

</svg>
